services:
  api:
    build: ./app/api
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}:/data
      - ./scripts:/scripts:ro
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/lnd:ro
    environment:
      BITCOIN_NETWORK: ${BITCOIN_NETWORK:-mainnet}
      LND_GRPC_HOST: ${LND_GRPC_HOST:-lightning_lnd_1:10009}
      TREASURY_PUBKEY: 02b759b1552f6471599420c9aa8b7fb52c0a343ecc8a06157b452b5a3b107a1bca
      COINBASE_APP_ID: 1cebd598-0a9d-4567-8603-8ef051fd1101
      COINBASE_WORKER_URL: "https://bitcorn-onramp.ethancail.workers.dev"
      # BASE rail (stablecoin) — chain selection + SIWE verification RPC.
      # All default to the live Base Sepolia deployment when unset; mainnet
      # values are set via .env at deploy day, never hardcoded here
      # (mainnet-preflight runbook §B1/§B2). env.ts guards BASE_CHAIN_ID:
      # empty/garbage falls back to 84532.
      BASE_CHAIN_ID: "${BASE_CHAIN_ID:-}"
      BASE_RPC_URL: "${BASE_RPC_URL:-}"
      BASE_CONFIRMATION_DEPTH: "${BASE_CONFIRMATION_DEPTH:-64}"
    networks:
      - umbrel

  web:
    build: ./app/web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - umbrel

networks:
  umbrel:
    external: true
    name: umbrel_main_network

name: Build and publish Docker images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/api/**"
      - "app/web/**"
      # A new image whose path is absent from this filter never rebuilds,
      # silently, forever. Tested programmatically against the literal patterns
      # in this block rather than eyeballed — see the build-loopd job below.
      - "app/loopd/**"
      - "bitcorn-lightning-node/umbrel-app.yml"
      - ".github/workflows/docker-publish.yml"

env:
  REGISTRY: ghcr.io
  OWNER: ethancail
  REPO: bitcorn-lightning-application

jobs:
  get-version:
    name: Read app version
    runs-on: ubuntu-latest
    # contents: write is required by the tag step below and by nothing else.
    # The repo default is read-only — verified, not assumed:
    #   gh api repos/ethancail/bitcorn-lightning-application/actions/permissions/workflow
    #   → {"default_workflow_permissions":"read", ...}
    # and this job previously declared no permissions block at all, so it ran
    # read-only. Scoped to THIS job deliberately: build-api and build-web keep
    # contents: read. Nothing that pushes an image needs write access to the repo.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tag assert below reads refs/tags, and the default fetch-depth: 1
          # fetches NO tags — the assert would then find nothing and pass on every
          # duplicate. Same precedent and same reason as pr-checks.yml's
          # version-bump job (fetch-depth: 0 for `git show BASE:file`), and it does
          # not depend on which v4.x the floating major tag resolves to.
          #
          # This line is load-bearing for a gate in a DIFFERENT step, so that step
          # does not trust it: it checks for itself that tags are present before
          # concluding anything from their absence.
          fetch-depth: 0

      # ── RELEASE PRECONDITION: THE BUNDLE'S CHAIN ────────────────────────
      # RELOCATED HERE FROM build-web ON 2026-08-14, and placed ahead of BOTH
      # tag steps below on purpose.
      #
      # WHY IT MOVED. In build-web this guard FAILED OPEN. It correctly failed
      # its own job, but build-api has no dependency on build-web — both are
      # only `needs: get-version` — so when it tripped, build-api was
      # concurrently pushing api:<version> and re-pointing api:latest. The
      # release then half-shipped: api images published, web images absent,
      # docker-compose pinning a web:<version> that does not exist, which is the
      # ~0%-install failure in CLAUDE.md § Umbrel Gotchas. get-version is the
      # sole common ancestor of both build jobs, so a failure here leaves BOTH
      # un-started and nothing is pushed. This is the same placement argument the
      # RELEASE TAG note below makes; that note cited THIS guard as its proof,
      # and the guard had been left where it was.
      #
      # WHY BEFORE THE TAG STEPS, NOT AFTER. get-version creates and pushes
      # v<version>. After the tag steps, a guard trip would leave the tag pushed
      # to origin with no images built, and recovery would require deleting a
      # published tag (the assert below would refuse a plain re-run). Before
      # them, a trip means fix-the-variable-and-rerun with nothing to undo.
      #
      # NO `if:` CONDITION — DROPPED 2026-08-14. It carried
      # `if: github.ref == 'refs/heads/main'`, which is always true: this
      # workflow's only trigger is `push: branches: [main]`. It could therefore
      # only ever subtract, per the rule stated in the RELEASE TAG note below —
      # "a job- or step-level condition would add nothing except a way for this
      # gate to be skipped". The step name keeps the words "on main builds"
      # because that is still what it describes; there is no other kind of build.
      #
      # WHAT GOES WRONG WITHOUT THIS. VITE_BASE_CHAIN_ID is baked at build time
      # and every default in the chain points at Base Sepolia: build-web's
      # `|| '84532'` below, app/web/Dockerfile's `ARG VITE_BASE_CHAIN_ID=84532`,
      # and wagmi.ts's `DEFAULT_CHAIN_ID === base.id ? base : baseSepolia`, which
      # resolves ANY value that isn't exactly 8453 to Sepolia. So forgetting the
      # deploy-day step "set the repo variable" produces a green build and a
      # bundle that silently settles on the wrong network.
      #
      # The failure is user-visible and money-adjacent: the router address comes
      # from the API's cache (mainnet), but the bundle forces the wallet onto
      # Sepolia and approves Sepolia USDC. The member gets a real wallet prompt
      # built from mismatched config. It reverts rather than misdirecting funds,
      # but it spends gas and asks someone to sign a transaction that cannot work.
      #
      # Scope note: this guards the BUILD-TIME variable only. There is still no
      # RUNTIME cross-check that the bundle's chain matches the chain the Worker
      # and cache are actually on — that needs a chain_id field on
      # /api/stablecoin/contract-state, which the response does not carry today.
      # Deliberately left as a separate arc.
      - name: Require VITE_BASE_CHAIN_ID on main builds
        env:
          CHAIN_ID: ${{ vars.VITE_BASE_CHAIN_ID }}
        run: |
          if [ -z "$CHAIN_ID" ]; then
            echo "::error::VITE_BASE_CHAIN_ID repo variable is not set."
            echo "A main-branch build must state its chain explicitly — the"
            echo "fallback is Base Sepolia (84532), which would ship a"
            echo "testnet-pinned bundle to production."
            echo "Set it under Settings → Secrets and variables → Actions → Variables:"
            echo "  8453  = Base mainnet"
            echo "  84532 = Base Sepolia"
            exit 1
          fi
          # Compare on the whitespace-stripped value, matching wagmi.ts's own
          # coercion: it does Number(RAW) === base.id, and Number() ignores
          # surrounding whitespace, so "8453 " really does resolve to mainnet
          # there. Rejecting it here would fail a build over a value that
          # actually works — a guard that cries wolf stops being trusted.
          TRIMMED="$(printf '%s' "$CHAIN_ID" | tr -d '[:space:]')"
          case "$TRIMMED" in
            8453|84532) ;;
            *)
              echo "::error::VITE_BASE_CHAIN_ID='$CHAIN_ID' is not a supported chain."
              echo "wagmi.ts resolves any value whose Number() isn't 8453 to Base"
              echo "Sepolia, so a wrong value here fails OPEN to testnet rather"
              echo "than erroring at runtime."
              echo "Expected 8453 (Base mainnet) or 84532 (Base Sepolia)."
              exit 1
              ;;
          esac
          echo "VITE_BASE_CHAIN_ID=$TRIMMED"

      - name: Read version from umbrel-app.yml
        id: version
        run: |
          VERSION=$(grep '^version:' bitcorn-lightning-node/umbrel-app.yml | sed 's/version: *"\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # ── RELEASE TAG ──────────────────────────────────────────────────────
      # WHY IT LIVES IN THIS JOB. get-version is the sole common ancestor of
      # build-api and build-web (both `needs: get-version`), so a failure here
      # leaves BOTH un-started and nothing is pushed. In-build-job placement fails
      # OPEN.
      #
      # ⚠ THE PROOF THIS NOTE USED TO CITE IS NOW HISTORICAL. It read: "this
      # workflow already contains the proof: the VITE_BASE_CHAIN_ID guard sits
      # inside build-web, so when it trips, build-api is concurrently pushing
      # api:<version> and re-pointing api:latest — the two build jobs have no
      # dependency on each other." That was true and unaddressed until
      # 2026-08-14, when the guard was moved into this job for exactly the reason
      # stated here; it now sits ABOVE these tag steps. The argument stands, the
      # example no longer does — do not read it as describing a live condition.
      # The build jobs still have no dependency on each other, so any NEW gate
      # belongs in this job for the same reason.
      #
      # NO `if:` CONDITION, ON PURPOSE. The trigger is already `branches: [main]`,
      # so a job- or step-level condition would add nothing except a way for this
      # gate to be skipped — and GitHub reports a skipped job as SUCCESS to a
      # required check. Do not add one.
      #
      # DELIBERATELY LABEL-AGNOSTIC. pr-checks.yml's version-bump job has an
      # `allow-same-tag-republish` escape hatch; this step does NOT read it and
      # cannot: a push event carries no PR labels
      # (github.event.pull_request is null here), so there is nothing to read.
      # The documented same-tag hotfix stays available via delete-the-tag-then-
      # rerun, printed in the failure text below. Do not "fix" this by plumbing
      # the label in.
      - name: Assert the release tag does not exist
        env:
          # Passed through env rather than interpolated into the run: body.
          # Workflow expressions are substituted into the whole run string before
          # bash sees it — including inside comments — which is why pr-checks.yml
          # dropped its only inline expression (see its web tsc step).
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # COULD-NOT-DETERMINE IS A FAILURE, NOT A PASS. `set -u` does NOT cover
          # this: env: always DEFINES the variable, so a failed grep yields an
          # empty string, not an unset one — measured, and it renders "Tag v".
          # Without this guard an unreadable manifest would tag literally "v" and
          # publish images tagged with the empty string.
          if [ -z "${VERSION:-}" ]; then
            echo "::error::Could not read the version from bitcorn-lightning-node/umbrel-app.yml."
            echo "Expected a line matching '^version:'. This is a failure, not a pass."
            exit 1
          fi

          # The rev-parse below is only meaningful if tags are actually in this
          # checkout. fetch-depth: 0 supplies them, but that is one line in a
          # different step — if it regresses, this assert finds nothing and passes
          # on EVERY duplicate. A blind check returns "no evidence" structurally,
          # which is indistinguishable from a real pass.
          if [ "$(git tag --list | wc -l)" -eq 0 ]; then
            echo "::error::No tags present in the checkout — the duplicate-tag check would be blind."
            echo "Expected 200+ annotated tags. Check get-version's checkout fetch-depth."
            exit 1
          fi

          # The image tags are BARE (1.18.2); all existing version tags are
          # v-PREFIXED (v1.18.2). The `v` is added here and nowhere else.
          TAG="v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING_SHA=$(git rev-list -n1 "$TAG")
            EXISTING_DATE=$(git for-each-ref "refs/tags/$TAG" --format='%(taggerdate:iso)')
            echo "::error::Tag $TAG already exists — refusing to publish."
            cat <<EOF

          ❌ Tag $TAG already exists — refusing to publish.
             Existing tag points at: $EXISTING_SHA ($EXISTING_DATE)

          A release must carry a new version. This build was triggered by a merge
          to main that touched a published path without bumping the version
          triplet, so publishing now would republish $TAG's image tags with
          different content under the same tag. That is the incident this gate
          exists to prevent — see docs/RELEASE.md.

          NO IMAGES WERE PUSHED. Two ways forward:

          1. INTENDED RELEASE — bump the version triplet (umbrel-app.yml +
             both docker-compose.yml image tags) and re-merge.

          2. DELIBERATE SAME-TAG REPUBLISH — the documented hotfix technique.
             Delete the tag first, then re-run; the tag is recreated at the new
             commit so it keeps identifying what actually shipped:

                 git push origin :refs/tags/$TAG
                 git tag -d $TAG
                 gh run rerun $GITHUB_RUN_ID
          EOF
            exit 1
          fi

          echo "$TAG does not exist yet — safe to publish."

      - name: Create and push the release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          # A GitHub runner has NO committer identity, and `git tag -a` writes a
          # tagger record — without this it exits 128 with "Committer identity
          # unknown" and creates nothing (verified against an isolated config).
          # Sourced from the API, not from memory:
          #   gh api 'users/github-actions[bot]' --jq '{id, login}'
          #   → {"id":41898282,"login":"github-actions[bot]"}
          # The API publishes no email for the bot (email: null), so the address
          # is CONSTRUCTED as <id>+<login>@users.noreply.github.com — the form
          # that attributes the tag to the Actions app in the GitHub UI.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -F - reads the message from stdin, which keeps the multi-line body out
          # of an argument and off this file's indentation.
          git tag -a "$TAG" -F - <<EOF
          $TAG

          Created by CI on merge to main.
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Commit: $GITHUB_SHA
          EOF

          git push origin "$TAG"
          echo "Pushed $TAG at $GITHUB_SHA"

  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    needs: get-version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.18.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}/api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.get-version.outputs.version }}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-web:
    name: Build web image
    runs-on: ubuntu-latest
    needs: get-version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.18.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠ THE VITE_BASE_CHAIN_ID GUARD USED TO LIVE HERE. It moved to
      # get-version on 2026-08-14 — see the step there and the RELEASE TAG note
      # above it. It is NOT gone, and it must not be re-added here: in this job
      # it failed OPEN, because build-api has no dependency on build-web and was
      # concurrently pushing api:<version> and re-pointing api:latest while this
      # guard tripped. The build-args below still consume the variable.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}/web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.get-version.outputs.version }}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VITE_BASE_CHAIN_ID is baked into the bundle at build time
          # (mainnet-preflight runbook §B1b). Reads the repo Actions variable
          # when set — deploy-day flip = set the variable + rebuild, no code
          # change — and falls back to Base Sepolia (84532) when unset.
          build-args: |
            VITE_BASE_CHAIN_ID=${{ vars.VITE_BASE_CHAIN_ID || '84532' }}

  # ── loopd — Bitcorn-published Lightning Labs loopd ───────────────────────
  # WHY WE PUBLISH THIS AT ALL. Upstream's own image is unusable on aarch64:
  # its Dockerfile pins both stages to ${BUILDPLATFORM} while its workflow
  # requests amd64+arm64, so the arm64 manifest entry carries an amd64 binary.
  # Measured, not assumed — the two per-arch entries of
  # lightninglabs/loop:v0.34.0-beta-v0.8.1-tapd share all four byte-identical
  # layer digests and differ only in the config blob's "architecture" string.
  # That is the failure that pushed Bitcorn onto litd in March 2026 (2dc6e8a),
  # and litd's cost is that it never re-reads LND's TLS cert and never exits.
  # app/loopd/Dockerfile carries the full account and the acceptance criteria.
  #
  # TAG SCHEME — DECIDED, and it is not the obvious one. This image is tagged
  # with the BITCORN app version, byte-identical to build-api and build-web
  # above: latest, <app version>, <short sha>. There is deliberately NO
  # loop-version tag; the shipped loopd version lives in the image's
  # org.opencontainers.image.version LABEL only.
  #
  # The consequence to know before "fixing" this: because this job keeps
  # `needs: get-version`, the rebuild trigger is A BITCORN RELEASE, not a
  # change to app/loopd/**. get-version asserts refs/tags/v<version> does not
  # exist, so a loopd-only merge to main with an unbumped version fails the
  # whole workflow at that assert rather than publishing. That is the gate
  # working — but it means bumping LOOP_VERSION in the Dockerfile ships only as
  # part of a release. Note also that pr-checks.yml's version-bump job diffs
  # `-- app/api app/web` only, so it will NOT ask for a bump on a loopd-only
  # PR; the two gates genuinely disagree, and get-version is the one that
  # decides whether anything is published.
  #
  # Version drift cannot arrive from the base image: app/loopd/Dockerfile pins
  # debian:12-slim by INDEX digest, so a Debian tag move cannot change these
  # bytes under an unchanged Bitcorn tag.
  build-loopd:
    name: Build loopd image
    runs-on: ubuntu-latest
    needs: get-version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kept for symmetry with build-api/build-web, and strictly unnecessary
      # here: app/loopd/Dockerfile's fetch stage runs on the build platform and
      # its final stage contains no RUN, so no target-arch instruction is ever
      # emulated. Left in so the next reader does not wonder why this job is
      # shaped differently from the two above it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.18.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}/loopd
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.get-version.outputs.version }}
            type=sha,prefix=,format=short

      # ⚠ A GREEN RUN HERE IS NOT EVIDENCE THAT THE arm64 IMAGE CONTAINS AN
      # arm64 BINARY. `platforms:` is a request, and upstream's broken image
      # proves a build can satisfy it and still be wrong. The real checks are
      # inside the Dockerfile (it reads e_machine out of every binary it copies
      # and refuses on mismatch) and on the hardware (DONE-WHEN item 1 there:
      # a local native build on the Pi, run BEFORE any release, because
      # get-version gates publishing behind one).
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app/loopd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: PR checks

# Pre-merge gate. This repo had NO test gate in CI — the only pre-merge
# verification was a local Stop hook, which is bypassable (VERIFY_GATE_SKIP=1)
# and doesn't exist for anyone working from another machine. This repo contains
# the payment rail; it should not be the one without CI.
#
# ⚠ DO NOT "SIMPLIFY" THIS BY CALLING scripts/verify-gate.mjs.
# That is the obvious-looking move and it produces a green check that verifies
# NOTHING. The hook decides what to run from `git status --porcelain -- app/api
# app/web` and exits 0 when the tree is clean (verify-gate.mjs, the
# `if (!apiDirty && !webDirty) process.exit(0)` line). A CI checkout is always
# clean, so it would no-op on every PR forever. CI must invoke tsc/vitest
# directly, as below.
#
# ⚠ npm install, NOT npm ci. package-lock.json is gitignored (.gitignore:3), so
# no lockfile exists on any branch and `npm ci` fails outright. Consequence
# worth knowing: CI is not reproducible — a dependency publishing a breaking
# patch inside a declared range can turn this red with no repo change.
#
# No push trigger on purpose. This is a PR gate; image publishing is
# docker-publish.yml's job and stays separate.

on:
  pull_request:

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # HARD GATES — every job in this workflow is now one; there is no advisory
  # section left. Verified passing on BOTH the main and develop trees, which
  # since v1.18.0 (2026-08-05) are the same commit.
  #
  # All four thresholds are STRICT as of 2026-08-07: web tsc ceiling 0, Worker
  # failure ceiling 0, Worker collection floor 200, api collection floor 300.
  # The two ceilings were branch-aware (main '17'/'9' vs develop '0') while the
  # trees differed; convergence turned those arms into pure slack, so they were
  # collapsed. Each carries its measurement and its history inline.
  # ─────────────────────────────────────────────────────────────────────

  api:
    name: API — typecheck + tests (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install
        working-directory: app/api
        run: npm install
      - name: Typecheck
        working-directory: app/api
        run: npx tsc --noEmit
      - name: Tests (collection floor)
        working-directory: app/api
        # ⚠ FLOOR, NOT A CEILING. This suite must pass at ZERO failures, and the
        # exit code below enforces that — unlike the Worker step, nothing here
        # discards it. The floor is about COLLECTION, a different failure.
        #
        # WHY THIS STEP NEEDS ONE — the exit code does not cover it. `vitest run`
        # exits 1 on ZERO collection ("No test files found, exiting with code 1",
        # re-verified 2026-08-07), so total collapse is caught for free. PARTIAL
        # collapse is not: measured 2026-08-07 in this very workspace,
        # restricting collection to one directory reported "Tests  60 passed
        # (60)" and exited 0 — 60 of 336, green, with nothing to distinguish it
        # from a full pass.
        #
        # That is the shape of this repo's real Node-22 incident: dropped
        # collection, not failures (see .nvmrc). The api suite is the LARGEST in
        # the repo — 336 tests across 24 files, measured 2026-08-07 — so it had
        # the most to lose and, until this floor, the least protection: the
        # Worker job carried the only one, and its own note claimed every other
        # job got collapse protection free from the exit code. True for total
        # collapse, false for partial. This closes that gap.
        #
        # VALUE: 300 against a measured 336, leaving 36 tests of headroom for
        # legitimate removals while rejecting any collapse below ~89% of the
        # suite. Removing 37+ api tests on purpose means lowering this number in
        # the same commit. Not branch-conditional, for the same reason the
        # Worker floor is not: gating main's PRs more loosely than develop's
        # would invert the risk.
        env:
          MIN_TOTAL: "300"
        run: |
          set -o pipefail
          rm -f /tmp/api-vitest.json
          # Exit code NOT discarded: a failing test fails this job here and now,
          # before the floor is ever consulted. The JSON report is read only for
          # the collection count.
          npx vitest run --reporter=json --outputFile=/tmp/api-vitest.json

          # COULD-NOT-RUN IS A FAILURE, NOT A PASS. If vitest exited 0 but wrote
          # no parseable report, a missing file must not read as "0 collected"
          # and then as some other job's problem.
          if [ ! -s /tmp/api-vitest.json ]; then
            echo "::error::API tests produced no JSON report — vitest could not run."
            echo "This is a failure, not zero failures. Check the step log above."
            exit 1
          fi

          TOTAL=$(node -e "
            const r = require('/tmp/api-vitest.json');
            if (typeof r.numTotalTests !== 'number') { console.error('unparseable report'); process.exit(3); }
            console.log(r.numTotalTests);
          ") || { echo "::error::API test report was unparseable."; exit 1; }

          echo "API tests: $TOTAL collected (floor: $MIN_TOTAL)"

          if [ "$TOTAL" -lt "$MIN_TOTAL" ]; then
            echo "::error::Only $TOTAL tests were collected; expected at least $MIN_TOTAL."
            echo "The suite did not fully run — this is a FAILURE, not a pass."
            echo "Likely causes: wrong Node version (see .nvmrc), a broken vitest"
            echo "config, moved/renamed test files, or a collection-time crash."
            exit 1
          fi

  web-build:
    name: Web — production build (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install
        working-directory: app/web
        run: npm install
      - name: Build
        working-directory: app/web
        # VITE_BASE_CHAIN_ID is deliberately NOT set here. This proves the
        # bundle builds without it; docker-publish.yml is where its absence
        # must fail a release, and it has its own guard for that.
        run: npx vite build

  web-typecheck:
    name: Web — typecheck (hard gate, error ceiling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install
        working-directory: app/web
        run: npm install
      - name: Typecheck (error ceiling)
        working-directory: app/web
        # ⚠ CEILING, NOT A PASS — though the ceiling is now 0, so on this tree
        # the two coincide. Kept in ceiling FORM rather than reduced to a bare
        # `tsc --noEmit` because the could-not-run guard below is the part that
        # carries the weight, and because a future known-bad baseline should
        # raise a number rather than re-add machinery.
        #
        # WHY A COUNT AND NOT AN ALLOWLIST: scripts/verify-gate.mjs already
        # carries a list of specific (file, TS-code) pairs (WEB_TSC_BASELINE). A
        # second copy here would drift from it. A number cannot drift that way.
        # It IS blunter — a new error appearing while an old one is fixed nets
        # zero and slips through — which is the accepted trade, and the reason
        # the ceiling was driven to 0 rather than maintained.
        #
        # ─── HISTORY ────────────────────────────────────────────────────
        #
        # Advisory until 2026-08-03, then a BRANCH-AWARE ceiling
        # (main '17' / develop '0') because the two trees genuinely differed.
        # main @ 19a667c measured 17, not the 6 recorded earlier: CI installs
        # from main's own package.json, which had NO vitest devDependency, while
        # main still TRACKED 10 app/web/src/**/*.test.ts files — so tsc added
        # 10 × TS2307 "Cannot find module 'vitest'" plus 1 knock-on TS7006 on top
        # of the known 6 (4 recharts `payload` + 2 src/pages/SwapOperations.tsx
        # TS2551/TS2339 for API-client methods deleted on develop by b818779).
        # That gap was the same class of miss as the .nvmrc incident: an audit
        # scoped to what a job MEASURES can miss what its environment PROVIDES.
        #
        # FLIPPED TO A FLAT "0" on 2026-08-07. The condition was met: v1.18.0
        # converged develop→main on 2026-08-05 and has held through v1.18.1, so
        # main now carries the vitest devDependency, vitest.config.ts, the
        # recharts annotations and b818779 — all 11 main-only errors gone with
        # them. Verified on the converged tree rather than assumed:
        #   cd app/web && npx tsc --noEmit 2>&1 | grep -c "error TS"   → 0
        # Re-measure with that command; do not trust this number.
        env:
          TSC_CEILING: "0"
        run: |
          # Exit code deliberately captured, NOT relied on as the signal: tsc
          # exits non-zero for "your code has type errors" AND for "I could not
          # run at all", and those must not be conflated.
          set +e
          npx tsc --noEmit >/tmp/web-tsc.log 2>&1
          TSC_EXIT=$?
          set -e
          cat /tmp/web-tsc.log

          # grep -c exits 1 on zero matches, which would kill the step under
          # pipefail — so absorb it and read the printed count.
          COUNT=$(grep -cE "error TS[0-9]+" /tmp/web-tsc.log || true)
          # This line used to also print the PR's base ref, to show which ceiling
          # arm applied. Dropped with the flip on 2026-08-07: there are no arms
          # now, and it was this file's only workflow expression interpolated
          # straight into a run block. Do not re-add one — expressions are
          # substituted into the whole run string before bash sees it, INCLUDING
          # inside comments like this one, so naming it literally here would put
          # it back.
          echo "Web tsc: $COUNT error(s) (ceiling: $TSC_CEILING)"

          # COULD-NOT-RUN IS A FAILURE, NOT ZERO ERRORS. Without this, a missing
          # tsc binary or an unreadable tsconfig exits non-zero, matches no
          # "error TS" lines, counts 0, and sails through a ceiling of 0 — a
          # green check proving nothing. This is the vacuous-green shape the
          # Worker step's no-report guard exists to stop, in its tsc form.
          if [ "$TSC_EXIT" -ne 0 ] && [ "$COUNT" -eq 0 ]; then
            echo "::error::tsc exited $TSC_EXIT but reported no 'error TS' lines — it could not run."
            echo "This is a FAILURE, not zero errors. Check the log above:"
            echo "likely a missing typescript install, a bad tsconfig, or a crash."
            exit 1
          fi

          if [ "$COUNT" -gt "$TSC_CEILING" ]; then
            echo "::error::Web tsc errors ($COUNT) exceed the ceiling ($TSC_CEILING)."
            echo "The ceiling is 0: this tree typechecks clean, so every error here"
            echo "is a NEW one. Fix it rather than raising the ceiling."
            exit 1
          fi

          # ⚠ UNREACHABLE while TSC_CEILING is 0 — nothing is below zero. Kept
          # (2026-08-07) because it is the branch that tells a future maintainer
          # to lock in a gain if the ceiling is ever raised off 0 again.
          if [ "$COUNT" -lt "$TSC_CEILING" ]; then
            echo "::notice::Only $COUNT errors — below the ceiling of $TSC_CEILING."
            echo "If you fixed some, lower TSC_CEILING in this workflow to lock the gain in."
          fi

  worker:
    name: Worker — typecheck + tests (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install
        working-directory: cloudflare-worker
        run: npm install

      - name: Typecheck
        working-directory: cloudflare-worker
        # Conditioned on the SCRIPT EXISTING, not on the branch — and a missing
        # script is now a FAILURE rather than a skip.
        #
        # SUPERSEDED REASONING, KEPT ON THE RECORD (written 2026-08-03/08-07,
        # when the else branch printed a ::notice:: and let the step exit 0):
        #
        #   "The `typecheck` script landed on develop and was absent from main, so
        #    a main-based PR had nothing to run. Skipping with an explanation
        #    beats both a spurious failure and a silent pass."
        #
        #   "⚠ THE SKIP BRANCH IS UNREACHABLE as of 2026-08-07: v1.18.0 put the
        #    `typecheck` script on main (cloudflare-worker/package.json), so no
        #    branch this workflow runs on lacks it. Kept rather than deleted …
        #    the condition still guards the genuinely different case of someone
        #    renaming or dropping the script."
        #
        # FLIPPED TO A HARD FAILURE 2026-08-14. The superseded note above got the
        # diagnosis right and the remedy wrong: the case it names — someone
        # renaming or dropping the script — is real and still reachable, but
        # GUARDING it means FAILING on it. A skip does not guard a case, it
        # tolerates it. Measured before flipping, by deleting the `typecheck` key
        # from cloudflare-worker/package.json and executing this step body
        # verbatim under /usr/bin/bash -e: the probe fell through and the step
        # exited 0 with tsc never invoked. That is a required check
        # ("Worker — typecheck + tests (hard gate)", pinned in ruleset 20756755)
        # reporting success having typechecked nothing.
        #
        # WHY IT MATTERED BEYOND THIS STEP: web-vitest's config skip cited this
        # one as its precedent, in as many words — "Same reasoning as the Worker
        # typecheck skip." Leaving this branch a skip would have left a live
        # in-repo precedent for the pattern that arc removed.
        #
        # ⚠ WHAT THIS DOES NOT CLOSE. A `typecheck` script that EXISTS but does
        # nothing still passes: `"typecheck": "true"`, an `echo`, or a tsconfig
        # with `files: []` all satisfy the probe and exit 0 with nothing checked.
        # Closing that needs an assertion that tsc actually ran and looked at
        # files — a different mechanism from an existence probe, deliberately not
        # attempted here. Note that app/api and app/web call `npx tsc --noEmit`
        # directly; this step is the only typecheck in the repo behind an npm
        # script, and that indirection is exactly what hides the no-op case.
        run: |
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo "::error::No 'typecheck' script in cloudflare-worker/package.json — this is a FAILURE, not a skip."
            echo "This job is a required check; exiting 0 here would report success"
            echo "having typechecked nothing. The script is present on both main and"
            echo "develop (v1.18.0 converged them), so its absence means it was"
            echo "renamed or dropped rather than never having shipped."
            echo "TO FIX: restore \"typecheck\": \"tsc --noEmit\" to the scripts block."
            exit 1
          fi

      - name: Tests (failure ceiling)
        working-directory: cloudflare-worker
        # ⚠ CEILING, NOT A PASS — though the ceiling is now 0, so on this tree
        # the two coincide. Asserts the failure count has not grown; a new
        # failure fails the job. Kept in ceiling FORM rather than reduced to a
        # bare `vitest run` because the could-not-run guard and the collection
        # floor below are the load-bearing parts, and a future known-bad
        # baseline should raise a number rather than re-add machinery.
        #
        # FLIPPED TO A FLAT "0" on 2026-08-07, replacing the branch-aware arms
        # (main '9' / develop '0'). The condition below was met: v1.18.0
        # converged develop→main on 2026-08-05 and has held through v1.18.1, so
        # main now carries the fixture fixes. Verified on the converged tree
        # rather than assumed:
        #   cd cloudflare-worker && npx vitest run   → 0 failed of 216
        #
        # ─── HISTORY: THE 9 STALE FIXTURES ──────────────────────────────
        #
        # THE 9 STALE FIXTURES ARE FIXED — on develop first, and on main since
        # the convergence release above. They were never
        # regressions; all nine had drifted behind deliberate implementation
        # changes, and each was repaired by correcting the FIXTURE, verified by
        # negative control (reverting each to its stale form reproduces the
        # original failure, for the original reason):
        #
        #   3 · tests/router.test.ts — /valuation/{current,history,inputs} sent
        #       no Bearer and expected 200. Tests written 2026-04-17/04-20; the
        #       JWT gate (withJwtGate "full") landed 2026-05-11 in a461f17
        #       "entitlement tokens (Stage 4)". The 401 was correct; the tests
        #       predated it by three weeks. Now carry a full-scope token from
        #       tests/helpers/entitlementToken.ts, so they assert ROUTING again.
        #
        #   2 · tests/inputs/priceHistory.test.ts — mocked a CoinGecko response.
        #       The upstream moved CoinGecko → Binance → Yahoo Finance on
        #       2026-05-06 (5d452c4, c05de8e "Binance is geo-blocked"). Now mock
        #       Yahoo's shape: parallel timestamp/close arrays, epoch SECONDS.
        #
        #   4 · tests/inputs/stockToFlow.test.ts — its `env` fixture had no
        #       PRICES_CACHE binding. stockToFlow derives from BTC price history
        #       (which reads KV), so kv.get() threw on undefined. Same
        #       2026-05-06 root cause. Fixture now binds KV per-test and pins
        #       the derived deviation against an independently-derived golden.
        #
        # ─── HISTORY: WHY THIS CEILING WAS BRANCH-AWARE ─────────────────
        #
        # The fixes landed on a develop-based branch, so they reached main only
        # at the convergence release. Until then the two trees genuinely
        # differed, MEASURED 2026-08-03: develop 216 tests / 0 failures; main @
        # 19a667c 116 tests / 9 failures (the same nine, unfixed).
        #
        # A SINGLE number could not serve both. Set to 9, develop — where
        # nearly all work happens — could regress nine tests and stay green; set
        # to 0 and every PR to main failed on failures nobody introduced. The
        # arms were therefore each tree's TRUE baseline, strictly tighter than
        # any single value.
        #
        # The lesson that outlived the arms: a branch-conditional threshold does
        # not break when its premise dies, it silently becomes SLACK. These arms
        # kept evaluating after v1.18.0 made both trees identical — main-based
        # PRs were simply allowed 9 free failures against a tree that had 0.
        # If you add a branch-conditional threshold, write its retirement
        # condition next to it, as the FLIP notes here did.
        env:
          MAX_FAILURES: "0"
          # ─── COLLECTION FLOOR ───────────────────────────────────────
          #
          # WHY ONLY THIS STEP HAS ONE — the structural reason, which the bare
          # number doesn't convey. `vitest run` exits 1 when zero tests are
          # collected ("No test files found, exiting with code 1" — verified
          # 2026-08-03). So every OTHER job in this workflow gets
          # collapse protection free, from the exit code alone.
          #
          # This step is the exception because it deliberately DISCARDS the exit
          # code (`|| true` below) in order to tolerate the 9 known failures.
          # The floor exists solely to replace the protection that trade gave
          # up. If you add another step that ignores an exit code to apply a
          # threshold, it needs its own floor. If your step relies on the exit
          # code, it does not.
          #
          # ORIGIN: added in response to negative-control NC6d, where a suite
          # collecting ZERO tests wrote a perfectly valid report saying
          # numFailedTests: 0 and sailed through the ceiling — "the suite didn't
          # run" reading as "the suite passed".
          #
          # Refined 2026-08-03 while re-controlling it: whether zero collection
          # writes a report at all is VITEST-VERSION-DEPENDENT. With this repo's
          # own vitest it writes none, so the no-report guard above catches that
          # case, not the floor. Both paths are therefore covered — but the
          # floor's UNIQUE and demonstrated value is PARTIAL collapse, where
          # vitest genuinely runs and reports. Measured: collection restricted to
          # one file reports 43 tests / 0 failures, which the ceiling PASSES
          # (0 > 9 is false) and only the floor rejects.
          #
          # That is also the shape of this repo's real Node-22 incident: dropped
          # collection, not failures (see .nvmrc and its tracking commit). A
          # ceiling cannot catch that class. This is why the floor is not
          # optional.
          #
          # VALUE: 200, raised from 100 on 2026-08-07. Deliberately NOT
          # branch-conditional: gating main's PRs more loosely than develop's
          # would invert the risk. That is also why this number never rotted the
          # way the two ceilings above did — a single value has no premise that
          # can quietly expire.
          #
          # Was 100 while the trees differed: main's suite was 116 tests, so a
          # floor of 200 was unsatisfiable there, not merely strict, and 100 was
          # the lowest common denominator both trees could clear. v1.18.0
          # converged them on 2026-08-05 and both are now 216, so the floor rises
          # to where it was always headed. Verified before raising, not assumed:
          #   cd cloudflare-worker && npx vitest run   → 216 collected
          #
          # 200 against 216 leaves 16 tests of headroom — deliberately tight,
          # since the point is to catch dropped collection. Removing 17+ Worker
          # tests on purpose means lowering this number in the same commit.
          # Chosen over 50 (would let a collapse to ~60 tests pass, missing the
          # partial-collection case the floor is for) and over 1 (catches only
          # total zero).
          MIN_TOTAL: "200"
        run: |
          set -o pipefail
          rm -f /tmp/worker-vitest.json
          # vitest exits non-zero when tests fail, which is expected here — so
          # the exit code is deliberately not the signal. The JSON report is.
          npx vitest run --reporter=json --outputFile=/tmp/worker-vitest.json || true

          # COULD-NOT-RUN IS A FAILURE, NOT A PASS. If vitest crashed before
          # writing a parseable report, treat it as a hard failure rather than
          # letting a missing file read as "0 failures".
          if [ ! -s /tmp/worker-vitest.json ]; then
            echo "::error::Worker tests produced no JSON report — vitest could not run."
            echo "This is a failure, not zero failures. Check the step log above."
            exit 1
          fi

          FAILED=$(node -e "
            const r = require('/tmp/worker-vitest.json');
            if (typeof r.numFailedTests !== 'number') { console.error('unparseable report'); process.exit(3); }
            console.log(r.numFailedTests);
          ") || { echo "::error::Worker test report was unparseable."; exit 1; }
          TOTAL=$(node -e "
            const r = require('/tmp/worker-vitest.json');
            if (typeof r.numTotalTests !== 'number') { console.error('unparseable report'); process.exit(3); }
            console.log(r.numTotalTests);
          ") || { echo "::error::Worker test report was unparseable."; exit 1; }

          echo "Worker tests: $FAILED failed of $TOTAL (ceiling: $MAX_FAILURES, floor: $MIN_TOTAL)"

          if [ "$TOTAL" -lt "$MIN_TOTAL" ]; then
            echo "::error::Only $TOTAL tests were collected; expected at least $MIN_TOTAL."
            echo "The suite did not fully run — this is a FAILURE, not a pass."
            echo "Likely causes: wrong Node version (see .nvmrc), a broken vitest"
            echo "config, moved/renamed test files, or a collection-time crash."
            exit 1
          fi
          if [ "$FAILED" -gt "$MAX_FAILURES" ]; then
            echo "::error::Worker test failures ($FAILED) exceed the ceiling ($MAX_FAILURES)."
            echo "The ceiling is 0: this suite passes clean, so every failure here is"
            echo "a NEW one. The 9 stale fixtures this ceiling used to tolerate were"
            echo "fixed and shipped to main in v1.18.0; yours is not one of them."
            exit 1
          fi
          # ⚠ UNREACHABLE while MAX_FAILURES is 0 — nothing is below zero. Kept
          # (2026-08-07) for the same reason as the tsc one above: it is the
          # branch that says "lock the gain in" if the ceiling ever rises off 0.
          if [ "$FAILED" -lt "$MAX_FAILURES" ]; then
            echo "::notice::Only $FAILED failures — below the ceiling of $MAX_FAILURES."
            echo "If you fixed some, lower MAX_FAILURES in this workflow to lock the gain in."
          fi

  # ─────────────────────────────────────────────────────────────────────
  # ASSERTIONS — pure git/YAML. No toolchain, so these are unaffected by
  # whichever tree the PR is based on.
  # ─────────────────────────────────────────────────────────────────────

  version-triplet:
    name: Version triplet agrees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: umbrel-app.yml version == every published image tag in compose
        # Drift here means umbreld offers version X while compose pins the old
        # tags, so a farmer "updates" to a new version number running the
        # previous code — with nothing erroring. Static check; runs on every
        # PR regardless of target branch.
        #
        # ⚠ THE JOB `name:` ABOVE IS A RULESET-PINNED REQUIRED CONTEXT.
        # Ruleset 20756755 pins its required checks by EXACT STRING. Renaming
        # this job is therefore a TWO-PART change — this file AND the ruleset,
        # together — because a renamed job against an unedited ruleset produces
        # a required context that never appears, and GitHub renders a context
        # that will never arrive identically to one that is still queuing. It
        # is not forbidden; it is strictly worse than extending this script,
        # which is why the loopd coverage below was added HERE.
        #   gh api repos/ethancail/bitcorn-lightning-application/rulesets/20756755
        #
        # ⚠ THE IMAGE SET IS DERIVED, NEVER LISTED. This step used to grep for
        # `/api:` and `/web:` by name. When loopd was added it was invisible
        # here, so a stale loopd tag passed every PR gate, the images published
        # at the new version, and the node pulled the PREVIOUS release's Loop
        # daemon — successfully, with nothing on the node reporting it. A hand
        # list cannot stay in step with an image set that grows, so the
        # expected set is read from docker-publish.yml's own `images:`
        # declarations: add a fourth image there and it is required here in the
        # same commit, with no edit to this file.
        run: |
          MANIFEST=bitcorn-lightning-node/umbrel-app.yml
          COMPOSE=bitcorn-lightning-node/docker-compose.yml
          PUBLISH=.github/workflows/docker-publish.yml

          # Same extraction docker-publish.yml uses, so this reads the version
          # exactly the way the publisher does.
          V=$(grep '^version:' "$MANIFEST" | sed 's/version: *"\(.*\)"/\1/')
          if [ -z "$V" ]; then
            echo "::error::Could not extract the version from $MANIFEST — the file format changed."
            echo "This check greps for a line matching '^version:'."
            exit 1
          fi

          # EXPECTED = what the publisher actually publishes. Each build job
          # declares `images: <registry>/<owner>/<repo>/<component>`, so the
          # component is the last path segment.
          EXPECTED=$(grep -E '^[[:space:]]*images:[[:space:]]' "$PUBLISH" | sed 's|.*/||' | sort -u)
          if [ -z "$EXPECTED" ]; then
            echo "::error::Found no 'images:' declarations in $PUBLISH."
            echo "Could-not-determine is a failure, not a pass: an empty expected set"
            echo "would let every tag in $COMPOSE through unchecked."
            exit 1
          fi

          # FOUND = every FIRST-PARTY pin in compose. Anchored on the `image:`
          # key so a comment that merely mentions ghcr.io cannot match, and
          # host-scoped to ghcr.io so third-party images (cloudflared) are not
          # dragged into this version contract — whether those get pinned is a
          # separate question and deliberately not decided here.
          PINS=$(grep -E '^[[:space:]]*image:[[:space:]]*"?ghcr\.io/' "$COMPOSE" \
                 | sed -e 's/^[[:space:]]*image:[[:space:]]*//' -e 's/[[:space:]].*$//' -e 's/"//g')

          # Print what matched, never just what failed: a pattern that silently
          # matches nothing is indistinguishable from a clean pass otherwise.
          echo "manifest version : $V"
          echo "publisher builds : $(echo $EXPECTED)"
          echo "compose pins     :"

          RC=0
          FOUND=
          for REF in $PINS; do
            case "$REF" in
              */*:*) ;;
              *)
                echo "  UNPARSEABLE  $REF"
                echo "::error::Unparseable image reference in $COMPOSE: '$REF'"
                echo "Expected the form ghcr.io/<owner>/<repo>/<component>:<tag>."
                RC=1
                continue
                ;;
            esac
            NAME=${REF%:*}; NAME=${NAME##*/}
            TAG=${REF##*:}
            FOUND="$FOUND $NAME"
            if [ "$TAG" = "$V" ]; then
              echo "  ok           $NAME -> $TAG"
            else
              echo "  MISMATCH     $NAME -> $TAG  (expected $V)"
              echo "::error::$COMPOSE pins $NAME at $TAG, but $MANIFEST says $V."
              RC=1
            fi
          done

          # Both directions of the set comparison. Tag equality alone would pass
          # vacuously if a pin went missing entirely — nothing left to disagree.
          for E in $EXPECTED; do
            if ! printf '%s\n' $FOUND | grep -qxF "$E"; then
              echo "::error::$PUBLISH publishes '$E' but $COMPOSE pins no ghcr.io image for it."
              echo "Every published image must be pinned here, or the release ships a"
              echo "component the node never receives."
              RC=1
            fi
          done
          for F in $FOUND; do
            if ! printf '%s\n' $EXPECTED | grep -qxF "$F"; then
              echo "::error::$COMPOSE pins '$F' but $PUBLISH publishes no such image."
              echo "That tag can never exist on ghcr.io — the install fails at 0%."
              RC=1
            fi
          done

          if [ "$RC" -ne 0 ]; then
            echo ""
            echo "TO FIX: make the version in $MANIFEST and EVERY ghcr.io image tag in"
            echo "$COMPOSE identical, in the same commit — one tag per published image"
            echo "($(echo $EXPECTED)), not just api and web."
            echo "See docs/RELEASE.md § Step 1."
            exit 1
          fi
          echo "Manifest and all $(printf '%s\n' $EXPECTED | wc -l) published image tags agree at $V."

  conflict-markers:
    name: No conflict markers
    runs-on: ubuntu-latest
    # An unresolved merge/cherry-pick hunk in a NON-TypeScript file passes every
    # other job in this workflow. Markers in .ts break tsc or the vite build, so
    # the coverage that exists today is an ACCIDENT OF THE TOOLCHAIN, not a
    # designed gate — .sql, .yml, .md and everything else are unguarded. This job
    # is the designed one.
    #
    # WHY THIS IS NOT COSMETIC. Migrations are filename-keyed and run at API
    # startup on every member node (app/api/src/index.ts:225 → runMigrations()).
    # A marker in a .sql throws a SQLite syntax error, which matches NEITHER
    # swallow condition in app/api/src/db/migrate.ts:46-57 ("duplicate column" /
    # "already exists"), so it rethrows and crashes the API at boot. And because
    # the applied-insert runs only AFTER db.exec succeeds, the migration is never
    # recorded as applied — so it rethrows again on the next restart, and the one
    # after that. IT DOES NOT SELF-HEAL.
    #
    # WHOLE-TREE, NOT A DIFF OF THE PR — the option that was measured and
    # rejected. `git diff --check` examines ADDED lines only, so a merge-base
    # diff-scan is blind to markers already committed: verified against a fixture
    # carrying six marker lines present on both sides, which reported nothing and
    # exited 0. Diffing against the EMPTY TREE presents every line as added, which
    # is what makes this fail closed. It also needs no history, which is why the
    # checkout below can stay at the default fetch-depth: 1 — a merge-base scan
    # would have required fetch-depth: 0 like version-bump.
    env:
      # The filter below greps for git's literal English "leftover conflict
      # marker". That string goes through gettext, so on a runner with a
      # localized locale git prints the translated wording, the filter matches
      # ZERO lines, and this gate goes green having detected nothing. Pinning the
      # locale removes that failure mode at the source. The canary in the step
      # below is what would CATCH it if this line were ever removed.
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
      - name: Detector canary, then whole-tree scan
        run: |
          # ── SUBJECT: HEAD, NOT THE WORKING TREE ─────────────────────────
          # This scans COMMITTED content. On a pull_request event
          # actions/checkout resolves refs/pull/N/merge, so HEAD is the synthetic
          # merge commit — the tree that merging this PR would produce, which is
          # exactly the right subject.
          #
          # Do NOT "fix" this to scan the working tree. In a fresh CI checkout the
          # worktree and HEAD are identical, so the change would look like a
          # harmless no-op here while silently reintroducing the
          # pre-existing-marker blindness that ruled out a diff-scan above.
          set -eu

          # Derived, not hardcoded. This is the well-known 4b825dc…4904, but
          # sourced from git itself rather than copied in as a magic constant.
          EMPTY_TREE=$(git hash-object -t tree /dev/null)

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          # ── KNOWN-POSITIVE CANARY ───────────────────────────────────────
          # A gate reporting "0 markers" is indistinguishable from a gate that
          # CANNOT DETECT markers at all. So before trusting the scan, prove the
          # detector fires on a planted marker in this environment. That upgrades
          # a green from "no markers found" to "detector proven live, and no
          # markers found" — and it keeps holding if a future git rewords the
          # message, with nobody having to remember to re-check.
          #
          # printf, NOT a heredoc: a heredoc terminator must sit at column 0,
          # which is impossible inside this indented YAML block scalar without
          # coupling the script to its own indentation.
          #
          # The fixture lives under mktemp -d, OUTSIDE the repo, so the scan below
          # cannot see it. (It could not anyway — that scan reads HEAD, not the
          # filesystem — but the fixture stays out of the tree regardless.)
          CANARY="$WORK/canary.txt"
          printf '%s\n' \
            'a context line, so the fixture is not markers alone' \
            '<<<<<<< HEAD' \
            'ours' \
            '=======' \
            'theirs' \
            '>>>>>>> feature/other' \
            > "$CANARY"

          # ── TWO EXIT-CODE INVERSIONS, BOTH DELIBERATE ───────────────────
          # 1. `git diff --check` exits 2 when it finds ANYTHING — including
          #    plain trailing whitespace, which this tree has and which is NOT
          #    this gate's business (measure with:
          #    git diff --check "$(git hash-object -t tree /dev/null)" HEAD).
          #    Its exit code therefore cannot be the signal; the FILTERED OUTPUT
          #    is.
          # 2. `grep` exits 1 on NO MATCH, which here is the CLEAN case — the
          #    inverse of the usual reading.
          # Under `set -e` either would kill this job for the wrong reason. A
          # bare pipeline would be worse, and the mechanism is worth naming
          # exactly, because this step has NO `shell:` key: that absence selects
          # `bash -e` — errexit only, NO pipefail. (Writing `shell: bash` would
          # select the STRICTER `bash --noprofile --norc -eo pipefail`; omitting
          # it is what buys the weaker shell. Confirmed in run 31541635531's log:
          # `shell: /usr/bin/bash -e {0}`.)
          #
          # Without pipefail a pipeline reports only its LAST command's status.
          # So `git diff --check … | grep -c …` would return GREP's exit code,
          # the could-not-run guard below would never see git's, and a git that
          # failed to run would be indistinguishable from a clean tree — the
          # exact vacuous green this job exists to prevent.
          # Hence `set +e` around each invocation with the code taken by hand.
          # Do not "simplify" these back into a bare pipeline.
          set +e
          git diff --no-index --check /dev/null "$CANARY" > "$WORK/canary.out" 2>&1
          CANARY_HITS=$(grep -c "leftover conflict marker" "$WORK/canary.out")
          set -e

          if [ "$CANARY_HITS" -ne 3 ]; then
            echo "::error::The conflict-marker detector FAILED ITS OWN CANARY."
            echo "A fixture with three planted markers produced $CANARY_HITS detection(s); expected 3."
            echo "This gate cannot report on the tree, because it cannot detect"
            echo "markers at all — a 'pass' here would prove nothing."
            echo "Likely causes: git reworded 'leftover conflict marker', or the"
            echo "LC_ALL=C pin on this job was removed and the message is localized."
            echo "--- canary detector output ---"
            cat "$WORK/canary.out"
            exit 1
          fi
          echo "Canary: $CANARY_HITS/3 planted markers detected — the detector is live here."

          # ── THE ACTUAL SCAN ─────────────────────────────────────────────
          set +e
          git diff --check "$EMPTY_TREE" HEAD > "$WORK/tree.out" 2>&1
          SCAN_EXIT=$?
          set -e

          # COULD-NOT-RUN IS A FAILURE, NOT ZERO MARKERS. 0 = found nothing at
          # all; 2 = found something (whitespace and/or markers). Any other code
          # is git failing to run, which must never read as a clean tree.
          if [ "$SCAN_EXIT" -ne 0 ] && [ "$SCAN_EXIT" -ne 2 ]; then
            echo "::error::git diff --check exited $SCAN_EXIT — it could not run."
            echo "This is a FAILURE, not zero markers. Output below:"
            cat "$WORK/tree.out"
            exit 1
          fi

          set +e
          COUNT=$(grep -c "leftover conflict marker" "$WORK/tree.out")
          FILTER_EXIT=$?
          set -e

          # grep -c prints 0 and exits 1 when nothing matched — the clean case.
          # Above 1 means grep itself failed: could-not-run again, not clean.
          if [ "$FILTER_EXIT" -gt 1 ]; then
            echo "::error::The marker filter (grep) exited $FILTER_EXIT — it could not run."
            echo "This is a FAILURE, not zero markers."
            exit 1
          fi

          echo "Leftover conflict markers in the committed tree: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT leftover conflict marker line(s) are committed in this tree."
            grep "leftover conflict marker" "$WORK/tree.out"
            echo ""
            echo "WHY THIS BLOCKS"
            echo "Migrations are filename-keyed and run at API startup on every"
            echo "member node (app/api/src/index.ts:225). A marker in a .sql throws a"
            echo "SQLite syntax error, which matches NEITHER swallow condition in"
            echo "app/api/src/db/migrate.ts:46-57, so it rethrows and crashes the API"
            echo "at boot. The applied-insert runs only after db.exec succeeds, so the"
            echo "migration is never recorded and it rethrows on every restart."
            echo "It does not self-heal."
            echo ""
            echo "TO FIX: resolve the hunk — keep one side and delete all three"
            echo "marker lines that git names above — then commit."
            exit 1
          fi

          echo "No leftover conflict markers."
          # END conflict-marker gate

  version-bump:
    name: Version bumped (PRs to main only)
    runs-on: ubuntu-latest
    # Scoped to main. PRs to develop publish nothing and must not require a
    # bump — requiring one there would make every feature PR bump the version.
    #
    # ESCAPE HATCH: the `allow-same-tag-republish` label. CLAUDE.md documents
    # same-tag republishing as a DELIBERATE technique (§ Umbrel Gotchas,
    # "Hotfix under same tag"), so it has to remain possible. A label was
    # chosen over a commit-message marker because it is visible on the PR and
    # in the merge record, requires a deliberate UI action, doesn't persist
    # into history where a cherry-pick would carry it, and leaves an auditable
    # trail: `gh pr list --label allow-same-tag-republish` lists every
    # intentional republish. That trail is exactly what was missing when this
    # happened by accident (see the error text below).
    if: >
      github.base_ref == 'main' &&
      !contains(github.event.pull_request.labels.*.name, 'allow-same-tag-republish')
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for `git show BASE:file` — a shallow clone doesn't have the
          # base commit's blobs.
          fetch-depth: 0
      - name: App code changed ⇒ version must change
        env:
          # Explicit SHAs, NOT HEAD/HEAD^. On a pull_request event
          # actions/checkout resolves refs/pull/N/merge, so HEAD is a synthetic
          # merge commit and HEAD^ is not the PR base.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MANIFEST=bitcorn-lightning-node/umbrel-app.yml

          APP_CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- app/api app/web)
          if [ -z "$APP_CHANGED" ]; then
            echo "No changes under app/api or app/web — no publish, no bump needed."
            exit 0
          fi

          ver_at() { git show "$1:$MANIFEST" | grep '^version:' | sed 's/version: *"\(.*\)"/\1/'; }
          VB=$(ver_at "$BASE_SHA")
          VH=$(ver_at "$HEAD_SHA")
          echo "base=$VB  head=$VH"

          if [ -z "$VB" ] || [ -z "$VH" ]; then
            echo "::error::Could not read the version from $MANIFEST on one side."
            echo "Could-not-determine is a failure, not a pass."
            exit 1
          fi

          if [ "$VB" = "$VH" ]; then
            echo "::error::App code changed but the version did not ($VB → $VH)."
            cat <<'EOF'

          WHY THIS BLOCKS
          Merging this to main fires docker-publish.yml, which reads the tag from
          umbrel-app.yml. With the version unchanged it REPUBLISHES the current
          release's image tags with different content. Nodes already on that
          version see no update and keep their cached image, while any fresh
          install or re-pull gets your code under the old tag — two nodes then
          report the same version while running different code, with nothing
          distinguishing them.

          This has happened twice, both on 1.17.19: 34c20c2 (PR #224) and
          f323faf (PR #227), 2026-07-21.

          TO FIX — bump all three, in one commit:
            1. bitcorn-lightning-node/umbrel-app.yml        version: "X.Y.Z"
            2. bitcorn-lightning-node/docker-compose.yml    api image tag
            3. bitcorn-lightning-node/docker-compose.yml    web image tag
          Add release notes to umbrel-app.yml's releaseNotes while you are there.
          Full procedure: docs/RELEASE.md

          IF THE REPUBLISH IS DELIBERATE (the documented same-tag hotfix), add the
          label `allow-same-tag-republish` to this PR. It is recorded on the PR and
          stays queryable: gh pr list --label allow-same-tag-republish
          EOF
            exit 1
          fi
          echo "Version bumped $VB → $VH."

  # ─────────────────────────────────────────────────────────────────────
  # THIS SECTION WAS "ADVISORY — non-blocking". IT IS NOW EMPTY OF ADVISORIES.
  #
  # Web typecheck left on 2026-08-03, promoted to a ceiling-gated hard gate.
  # Web vitest left on 2026-08-07, promoted once v1.18.0 put the vitest standup
  # on main. Both now sit in the HARD GATES section above.
  #
  # Kept as a marker rather than deleted, because the reasoning below is the
  # thing to read BEFORE adding an advisory job here again: `continue-on-error`
  # at JOB level renders as a failing red check, indistinguishable from a real
  # failure, which is precisely what trains a reader to click past red. At STEP
  # level it is worse — green always, including when a new failure appears.
  # There is no placement that makes an advisory job honest, so treat one as a
  # temporary state with a written retirement condition, never a resting state.
  # ─────────────────────────────────────────────────────────────────────

  web-vitest:
    name: Web — tests (hard gate)
    runs-on: ubuntu-latest
    # PROMOTED FROM ADVISORY on 2026-08-07. It was non-blocking because main's
    # tree had no web test infrastructure at all — no `vitest` devDependency, no
    # `test` script, no app/web/vitest.config.ts — so on a main-based PR it
    # could not run at all ("vitest is not installed", not "tests failed").
    # v1.18.0 converged develop→main on 2026-08-05 and carried the vitest
    # standup, so main now has all three. Verified before promoting:
    #   git show origin/main:app/web/package.json   → "vitest": "^2.1.9"
    #   git ls-tree origin/main -- app/web/vitest.config.ts   → present
    #
    # Its `continue-on-error` was at JOB level, which rendered the advisory as a
    # failing red check — indistinguishable from a real failure, which is
    # precisely what trains a reader to click past red. Step level would have
    # been worse: green always, including when a new failure appeared. Neither
    # is a good resting state, which is why advisory was always meant to be
    # temporary.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install
        working-directory: app/web
        run: npm install
      - name: Tests
        working-directory: app/web
        # TWO GUARDS DOING DIFFERENT JOBS. The config assert catches "the test
        # environment is gone"; the collection floor catches "the suite ran, but
        # only part of it". Neither substitutes for the other — each was measured
        # on 2026-08-14 catching a case the other passes. Both replaced a bare
        # `npx vitest run` that had no assertion beyond vitest's exit code.
        #
        # ─── 1. CONFIG ASSERT — WAS AN `exit 0` SKIP UNTIL 2026-08-14 ────
        #
        # SUPERSEDED REASONING, KEPT ON THE RECORD (written 2026-08-07, when
        # this branch printed a ::notice:: and exited 0):
        #
        #   "Detect-and-explain rather than emitting a confusing red that readers
        #    learn to ignore. Same reasoning as the Worker typecheck skip."
        #
        #   "⚠ THE SKIP BRANCH IS UNREACHABLE as of 2026-08-07: v1.18.0 put
        #    app/web/vitest.config.ts on main, so no branch this workflow runs on
        #    lacks it. Kept rather than deleted … If you delete it, make sure a
        #    missing config still FAILS rather than silently collecting nothing;
        #    the collection floor on the api job explains why that matters."
        #
        # That last sentence called this fix a year early. Heed it: the assert
        # below is the "still FAILS" half, the floor is the "collecting nothing"
        # half, and neither may be softened back into a skip.
        #
        # WHY THE SKIP WAS WRONG — MEASURED, not reasoned. The justification was
        # that main's tree had "no web test infrastructure at all — no vitest
        # devDependency, no test script, no app/web/vitest.config.ts" and so
        # "could not run at all". Two of those three are present on this tree,
        # and THE THIRD IS NOT REQUIRED: vitest collects without a config,
        # falling back to vite.config.ts plus its own defaults. Renaming
        # app/web/vitest.config.ts away and running this body with the skip
        # removed, on 2026-08-14 under Node v20.20.2:
        #
        #   Test Files  2 failed | 18 passed (20)
        #        Tests  17 failed | 240 passed (257)      → vitest exited 1
        #
        # All 20 files and all 257 tests were still COLLECTED. The 17 failures
        # are `localStorage is not defined` (16, src/stablecoin/pendingStore.test.ts)
        # and `window is not defined` (1, src/stablecoin/secureContext.test.ts),
        # because the fallback environment is `node`, not the `jsdom` this repo's
        # config sets — visible in the run summary as `environment 5ms` against
        # ~30s with jsdom.
        #
        # So the skip was never covering a case where nothing could run. It was
        # CONVERTING A LIVE RED INTO A GREEN. Hence an assert, not a skip — and
        # hence this branch must NOT be called unreachable: it is reached by
        # exactly the event it now catches, the config being moved, renamed or
        # deleted. The 2026-08-07 note called it unreachable because it was
        # thinking only of the main-based-PR case, which convergence did retire.
        #
        # ─── 2. COLLECTION FLOOR ─────────────────────────────────────────
        #
        # WHY THIS STEP NEEDS ONE — the exit code does not cover it. `vitest run`
        # exits 1 on ZERO collection, so total collapse is caught for free.
        # PARTIAL collapse is not: the suite genuinely runs, reports 0 failures,
        # exits 0, and nothing distinguishes it from a full pass. That is the
        # shape of this repo's real Node-22 incident — dropped collection, not
        # failures (see .nvmrc). The api job's floor comment carries the full
        # argument and the measurement that killed the "every other job gets
        # collapse protection free from the exit code" claim.
        #
        # VALUE: 230 against a measured 257 = 89.5%, which is API'S RATIO
        # (300/336 = 89.29%) applied to web's own measured N. api is the matched
        # precedent, not worker: this step, like api's, keeps vitest's EXIT CODE
        # LIVE as the failure signal. worker's tighter 92.59% (200/216) exists
        # because worker discards its exit code with `|| true` to apply a failure
        # ceiling, so its floor has to cover what the exit code covers here.
        # Match the precedent whose exit-code posture you share.
        #
        # MEASUREMENT PROVENANCE: 257 tests across 20 files, measured 2026-08-14
        # under Node v20.20.2 from a clean `npm install` in a fresh worktree —
        # NOT carried forward from a prior report. Corroborated independently by
        # CI run 31732161503 (2026-08-13), which logged the same 20/257.
        # Re-measure rather than trusting this number:
        #   cd app/web && npx vitest run
        #
        # HEADROOM: 27 tests. At the measured distribution (min 3, max 28,
        # median 11, mean 12.85 tests/file) that is 4 whole files taking the
        # smallest first — but NOT the largest: src/stablecoin/submitGuard.test.ts
        # alone is 28 tests, so deliberately deleting it requires lowering this
        # number in the SAME COMMIT. web's spread is far wider than api's
        # (max is 2.18x the mean, 9.3x the min), so "headroom in files" is a
        # range here, not a number.
        #
        # ⚠ THIS NUMBER IS INSTRUCTION-SHAPED, AND IT ROTS IN ONE DIRECTION.
        # It is an integer in a file that nothing keeps current. Every test ADDED
        # widens the gap between floor and reality, so the protection weakens
        # monotonically with nobody editing anything and nothing going red. The
        # only thing holding it current is a person reading this comment while
        # removing a test. That is a real limitation, not a nitpick: as written,
        # 230 against a suite that has grown to 400 would permit a 42% collapse.
        #
        # ⚠ AND IT STRUCTURALLY CANNOT SEE A FILE THE INCLUDE PATTERN NEVER
        # MATCHED. app/web/vitest.config.ts pins `include: ["src/**/*.test.ts"]`,
        # which EXCLUDES `.test.tsx`. An uncollected file contributes nothing to
        # numTotalTests and nothing to this expectation, so a component test
        # written as `.test.tsx` is silently absent and this floor stays green.
        # Measured 2026-08-14: disk 20 == collected 20 (`git ls-files
        # 'app/web/src/**/*.test.ts' | wc -l` → 20, `…*.test.tsx` → 0), so the
        # gap is LATENT, not live. Broadening the include is a separate backlog
        # item and deliberately not done here.
        #
        # ⚠ IF YOU REACH FOR A FILE-BASED FLOOR INSTEAD, READ THIS FIRST.
        # `numTotalTestSuites` IS NOT A FILE COUNT — vitest counts describe
        # blocks there. Measured 2026-08-14 on this 20-file suite:
        # numTotalTestSuites = 83, testResults.length = 20. Keying a floor on
        # numTotalTestSuites is wrong by ~4x IN THE PERMISSIVE DIRECTION: a
        # plausible-looking floor of 18 against a reported 83 would pass a 78%
        # file-level collapse. The file count is testResults.length.
        env:
          MIN_TOTAL: "230"
        run: |
          set -o pipefail

          # Fires BEFORE vitest is invoked, on purpose: a missing config means
          # the suite would run under the wrong environment, which is a failure
          # to state rather than a condition to tolerate or to discover from 17
          # confusing assertion errors.
          if [ ! -f vitest.config.ts ]; then
            echo "::error::app/web/vitest.config.ts is missing — this is a FAILURE, not a skip."
            echo "vitest still COLLECTS without it, falling back to vite.config.ts"
            echo "defaults, but under the 'node' environment instead of jsdom."
            echo "Measured 2026-08-14: 17 of 257 tests then fail with"
            echo "'localStorage is not defined' / 'window is not defined'."
            echo "TO FIX: restore app/web/vitest.config.ts. Do not soften this"
            echo "check back into a skip — see the comment above this step."
            exit 1
          fi

          rm -f /tmp/web-vitest.json
          # Exit code NOT discarded: a failing test fails this job here and now,
          # before the floor is ever consulted. The JSON report is read only for
          # the collection count. (worker discards its exit code with `|| true`
          # solely to apply a failure ceiling; this step, like api's, does not.)
          npx vitest run --reporter=json --outputFile=/tmp/web-vitest.json

          # COULD-NOT-RUN IS A FAILURE, NOT A PASS. If vitest exited 0 but wrote
          # no parseable report, a missing file must not read as "0 collected"
          # and then as some other job's problem.
          if [ ! -s /tmp/web-vitest.json ]; then
            echo "::error::Web tests produced no JSON report — vitest could not run."
            echo "This is a failure, not zero failures. Check the step log above."
            exit 1
          fi

          TOTAL=$(node -e "
            const r = require('/tmp/web-vitest.json');
            if (typeof r.numTotalTests !== 'number') { console.error('unparseable report'); process.exit(3); }
            console.log(r.numTotalTests);
          ") || { echo "::error::Web test report was unparseable."; exit 1; }

          echo "Web tests: $TOTAL collected (floor: $MIN_TOTAL)"

          if [ "$TOTAL" -lt "$MIN_TOTAL" ]; then
            echo "::error::Only $TOTAL tests were collected; expected at least $MIN_TOTAL."
            echo "The suite did not fully run — this is a FAILURE, not a pass."
            echo "Likely causes: wrong Node version (see .nvmrc), a broken vitest"
            echo "config, moved/renamed test files, or a collection-time crash."
            exit 1
          fi

services:
  api:
    image: ghcr.io/ethancail/bitcorn-lightning-application/api:1.18.11
    restart: unless-stopped
    ports:
      - "3101:3101"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/lnd:ro
      # Loop data. The host directory is still named `litd` on purpose — see the
      # loopd service below. loopd derives BOTH credentials from --loopdir, so
      # the cert and the macaroon now sit together at .loop/<network>/.
      - ${APP_DATA_DIR}/litd:/loop-data:ro
    # Operator secrets (VALUATION_SUBMIT_HMAC) are loaded from `.env` next to
    # this file via `exports.sh` (sibling file). We use exports.sh instead of
    # compose's `env_file` directive because under umbreld's legacy-compat
    # invocation, relative env_file paths resolve against the fragment compose
    # file's directory (not ours), so `.env` can't be found. exports.sh runs
    # before docker compose and exports .env vars to the shell, which compose
    # then picks up via `${VAR:-}` interpolation below.
    environment:
      BITCOIN_NETWORK: ${BITCOIN_NETWORK:-mainnet}
      # LND TLS cert SANs include 10.21.21.9 but NOT Docker DNS names.
      LND_GRPC_HOST: 10.21.21.9:10009
      TREASURY_PUBKEY: 02b759b1552f6471599420c9aa8b7fb52c0a343ecc8a06157b452b5a3b107a1bca
      COINBASE_APP_ID: 1cebd598-0a9d-4567-8603-8ef051fd1101
      COINBASE_WORKER_URL: "https://bitcorn-onramp.ethancail.workers.dev"
      # Auto-buy scheduler master enable (env-level kill switch). env.ts reads
      # `AUTOBUY_ENABLED === "true"`; any other value (or unset) resolves to
      # false, and every 15-min scheduler tick silently no-ops at canSchedule()
      # regardless of the in-app autobuy_config.enabled flag (the UI badge).
      # Must be the literal string "true". Absent here pre-v1.17.5 → auto-buy
      # was dormant in production despite the UI showing "Enabled".
      AUTOBUY_ENABLED: "true"
      # Container name umbreld derives from the `loopd` service below — not a
      # service alias, which would collide on the shared umbrel_main_network.
      LOOP_GRPC_HOST: bitcorn-lightning-node_loopd_1
      LOOP_GRPC_PORT: "11010"
      LOOP_TLS_CERT_PATH: "/loop-data/.loop/mainnet/tls.cert"
      LOOP_MACAROON_PATH: "/loop-data/.loop/mainnet/loop.macaroon"
      # Valuation manual-input submission — shared HMAC with the Cloudflare Worker.
      # Set this in a `.env` file next to docker-compose.yml (loaded via
      # exports.sh, not compose's env_file; gitignored repo-wide). Generate a
      # fresh secret per install with:
      #   openssl rand -hex 32
      # Put the SAME value on the Worker via:
      #   cd cloudflare-worker && npx wrangler secret put VALUATION_SUBMIT_HMAC
      # If unset, POST /api/valuation/manual returns 503 valuation_worker_not_configured.
      # See .env.example in this directory for the template.
      VALUATION_SUBMIT_HMAC: "${VALUATION_SUBMIT_HMAC:-}"
      # Optional — defaults to COINBASE_WORKER_URL above. Only override if the
      # valuation endpoint ever lives on a different Worker than the Onramp one.
      VALUATION_WORKER_URL: "${VALUATION_WORKER_URL:-}"
      # BASE rail (stablecoin) — chain selection + SIWE verification RPC.
      # Set in `.env` next to this file (loaded via exports.sh, same as
      # VALUATION_SUBMIT_HMAC above). See .env.example for the template.
      #
      # ⚠ THIS BLOCK USED TO SAY "mainnet values are set via .env at deploy day,
      # never hardcoded here." THAT INSTRUCTION CREATED A FLEET-WIDE BUG, and it
      # is corrected below rather than deleted, because the reasoning matters.
      #
      # It assumed one operator editing one .env. But MEMBERS ADMINISTER THEIR
      # OWN NODES. A per-node .env edit is not an instruction anyone can deliver
      # to a fleet, so a var whose mainnet value lives only in .env is a var that
      # is wrong on every member node. Anything that must be right on every node
      # has to ship WITH THE CODE. Anything that cannot ship (secrets) must fail
      # safely and say so — which is the split below.
      #
      # BASE_CHAIN_ID — SHIPS MAINNET (8453) BY DEFAULT.
      #   Which chain member wallet signatures are pinned to (SIWE). It must
      #   agree with the web bundle's build-time VITE_BASE_CHAIN_ID, which CI
      #   requires explicitly on main builds. Disagreement means every member
      #   fails wallet registration with chain_id_mismatch (siwe.ts).
      #   ⚠ Local dev builds the web image from app/web/Dockerfile, whose
      #   ARG VITE_BASE_CHAIN_ID still defaults to 84532 — deliberately, so a
      #   local build never silently produces a mainnet bundle. So a local
      #   `docker compose up --build` gives bundle=84532 against api=8453 and
      #   SIWE refuses with chain_id_mismatch. That is the intended failure:
      #   it fails CLOSED and names itself. For local testnet work set
      #   BASE_CHAIN_ID=84532 in .env to match.
      #
      # BASE_RPC_URL — CANNOT SHIP. It carries an embedded API key, so there is
      #   no value that is safe to commit. Its absence is PARTIAL degradation,
      #   not failure: EOA wallets (MetaMask, WalletConnect) still verify via the
      #   local fallback in siwe.ts; ERC-1271 smart wallets (Coinbase Smart
      #   Wallet — the DEFAULT connector) cannot be verified without a chain
      #   read, and are refused with `smart_wallet_verification_unavailable`.
      #
      # BASE_CONFIRMATION_DEPTH — safe non-chain-specific default, unchanged.
      BASE_CHAIN_ID: "${BASE_CHAIN_ID:-8453}"
      BASE_RPC_URL: "${BASE_RPC_URL:-}"
      BASE_CONFIRMATION_DEPTH: "${BASE_CONFIRMATION_DEPTH:-64}"
    depends_on:
      - loopd
    networks:
      - umbrel

  # Cloudflare Tunnel sidecar — exposes the API container at a stable
  # public hostname (e.g., https://treasury.<operator-domain>) via an
  # outbound-initiated connection to Cloudflare's edge. Required for
  # cross-tailnet members to reach the treasury (Stage 4.5 reachability
  # gap; see bitcorn-research spec 2026-05-16-cloudflare-tunnel-hardening).
  #
  # Gated by the `tunnel` compose profile so deployments without a
  # Cloudflare account / TUNNEL_TOKEN don't crash-loop this container.
  # Operators on Phase 4 set `COMPOSE_PROFILES=tunnel` in `.env` to
  # activate; operators staying on Phase 1 (manual ephemeral tunnel) or
  # tailnet-only deployments leave it unset.
  #
  # Routing target (set in Cloudflare dashboard → Tunnel → Public Hostname):
  #   http://bitcorn-lightning-node_api_1:3101
  # Full container name avoids service-alias collisions on Umbrel's
  # shared `umbrel_main_network` (same discipline as LOOP_GRPC_HOST).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bitcorn-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - api
    networks:
      - umbrel
    profiles:
      - tunnel

  # Standalone loopd, from the Bitcorn-published image. This replaced litd in
  # v1.18.9; litd had been standing in since March 2026 (`2dc6e8a`) only because
  # upstream's `lightninglabs/loop` arm64 image ships an amd64 filesystem.
  # app/loopd/Dockerfile repackages upstream's release binaries and refuses to
  # publish a wrong-architecture one — see its header for the mechanism.
  #
  # ⚠ WHAT THIS DOES NOT YET RETIRE — stated precisely, because the tempting
  # version of this paragraph claims a fix that has never been observed.
  # litd never re-read LND's TLS cert and never exited, so Loop stayed dead
  # after a rotation until a human restarted Bitcorn.
  #   VERIFIED (upstream source): loopd exits when the LND block-epoch stream
  #     breaks, and `restart: unless-stopped` then brings it back.
  #   INFERENCE, NEVER OBSERVED: that an Umbrel LND cert rotation is a thing
  #     that breaks that stream. Nobody has watched one. The two facts only
  #     compose into self-healing if that middle step holds, and it is exactly
  #     the step with no evidence behind it.
  # So assume the second restart is still required. `certExpiry.ts:184-185`
  # and `:194-195` tell farmers precisely that, deliberately left in place, and
  # this comment must not contradict shipped copy on the strength of a guess.
  # WHAT CLOSES IT: one watched cert rotation with loopd running. Either the
  # loopd container restarts on its own — self-healing confirmed, and the cert
  # copy can then be revisited — or it does not, and the copy is already right.
  # The asymmetry favours the current copy meanwhile: a needless restart costs
  # a minute, a missing instruction leaves a farmer with dead Loop.
  loopd:
    image: ghcr.io/ethancail/bitcorn-lightning-application/loopd:1.18.11
    restart: unless-stopped
    volumes:
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/lnd:ro
      # ⚠ STILL `litd` ON DISK, DELIBERATELY — do not "fix" this name.
      # loopd 0.33.0 opens litd 0.31.8's database and applies no migration
      # (verified on aarch64 and x86_64). Reusing the directory carries
      # in-flight swaps, the state banked in the WAL, and the l402 token across
      # the swap. A fresh directory would strand every node's Loop history.
      - ${APP_DATA_DIR}/litd:/litd-data
    environment:
      HOME: /litd-data
    command:
      - loopd
      - --network=${BITCOIN_NETWORK:-mainnet}
      # LND TLS cert SANs include 10.21.21.9 but NOT Docker DNS names.
      - --lnd.host=10.21.21.9:10009
      - --lnd.macaroonpath=/lnd/data/chain/bitcoin/${BITCOIN_NETWORK:-mainnet}/admin.macaroon
      - --lnd.tlspath=/lnd/tls.cert
      # ⚠ THE BIND ADDRESS IS LOAD-BEARING, not decoration. loopd defaults to
      # localhost:11010 — unlike litd's --httpslisten, this is not a port-only
      # translation. On loopback the api container cannot reach it over Docker
      # DNS and Loop is dead fleet-wide, while the daemon still starts, logs
      # clean and answers --version. Only reachable inside the Docker network;
      # not published to the host.
      - --rpclisten=0.0.0.0:11010
      # REST: loopback deliberately. Unused by Bitcorn, and keeping it off the
      # shared network is what makes this swap a net reduction in attack
      # surface — litd exposed a unified UI/session endpoint on 8443 behind a
      # hardcoded password; this is Loop-only gRPC behind a macaroon.
      - --restlisten=127.0.0.1:8081
      # loopdir owns every derived path: <loopdir>/<network>/ holds tls.cert,
      # tls.key, loop.macaroon and the database. No TLS flags belong here —
      # loopd's autogenerated cert already carries DNS:localhost, which is what
      # loop.ts's ssl_target_name_override needs, so --tlsdisableautofill would
      # break it. And never --tlsautorefresh: it is declared upstream and read
      # nowhere, so `loopd --help` confirms a flag that does nothing
      # (learnings.md, 2026-08-25; app/loopd/Dockerfile:263).
      - --loopdir=/litd-data/.loop
    networks:
      - umbrel

  web:
    image: ghcr.io/ethancail/bitcorn-lightning-application/web:1.18.11
    restart: unless-stopped
    ports:
      - "3200:3200"
    depends_on:
      - api
    networks:
      - umbrel

networks:
  umbrel:
    external: true
    name: umbrel_main_network
